name: Android CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Generate Coverage Report
      run: ./gradlew jacocoTestReport

    - name: Add Coverage PR Comment
      uses: Madrapps/jacoco-report@v1.8.0
      if: github.event_name == 'pull_request'
      with:
        paths: ${{ github.workspace }}/app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        min-coverage-overall: 40
        min-coverage-changed-files: 60

    - name: Build Debug Build (Pull Request)
      if: github.event_name == 'pull_request'
      run: ./gradlew assembleDebug

    - name: Build Release AAB
      if: github.event_name == 'push'
      run: ./gradlew bundleRelease

    - name: Sign AAB
      if: github.event_name == 'push'
      id: sign_app
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/bundle/release
        signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Extract version name
      if: github.event_name == 'push'
      id: extract_version
      run: |
        VERSION_NAME=$(grep "versionName" app/build.gradle | awk '{print $2}' | tr -d '\"')
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

    - name: Create Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION_NAME }}
        name: Release v${{ env.VERSION_NAME }}
        files: ${{ steps.sign_app.outputs.signedReleaseFile }}
        generate_release_notes: true

    - name: Upload to Google Play
      if: github.event_name == 'push'
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        packageName: com.dsource.idc.jellowintl
        releaseFiles: ${{ steps.sign_app.outputs.signedReleaseFile }}
        track: production
        status: draft
